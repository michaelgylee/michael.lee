name: Update verified news cache

on:
  workflow_dispatch:
  schedule:
    # Hourly: TreeSoop publishes once a day, and this keeps the window between
    # a new post and the cache picking it up down to about an hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: verified-news-cache
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve original articles and build three-sentence summaries
        run: python scripts/update_news_cache.py
      - name: Mirror TreeSoop daily AI news
        if: always()
        run: python scripts/update_treesoop_cache.py
      - name: Commit refreshed cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-cache.json data/treesoop-cache.json
          git diff --cached --quiet || git commit -m "chore: refresh verified news cache"
          git push
